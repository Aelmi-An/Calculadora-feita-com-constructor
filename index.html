<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Idade - POO</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; padding-top: 40px; background-color: #f4f6f9; }
        .card { background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-bottom: 15px; width: 100%; padding: 10px; background-color: #74551d; color: white; border: white 1px; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #7c5c18; }
        .resultado-box { margin-top: 20px; padding: 12px; background-color: #e9ecef; border-radius: 4px; text-align: center; font-weight: bold; min-height: 20px; color: #4b2812; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Calculadora</h2>
        
        <div class="campo">
            <label for="n1m">Primeiro Número:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="campo">
            <label for="n2m">Segundo Número:</label>
            <input type="text" id="n2m" placeholder="Digite seu sobrenome">
        </div>

    
        <button id="soma" onclick = "calculo('+')">+</button>
        <button id="subtação" onclick="calculo('-')">-</button>
        <button id="multiplicação" onclick="calculo('x')">x</button>
        <button id="divisão" onclick="calculo('*')">/</button>
        
        <script>
            let Operação = '';
           function calculo(escolha){
           Operação = escolha;
           console.log(Operação)
           }
        </script>

        <button id="btnCalcular">Calcular</button>

        <div class="resultado-box" id="resultado">
            
        </div>
    </div>

</body>
</html>
